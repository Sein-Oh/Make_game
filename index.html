<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>해리 포터 생존기</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0c18; font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #fff; touch-action: none; user-select: none; }
  canvas { display: block; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8,6,20,.88); text-align: center; padding: 16px; }
  .hidden { display: none; }
  h1 { font-size: 38px; margin: 0 0 8px; color: #f3c74f; text-shadow: 0 3px 0 #6b1015; }
  p { margin: 6px 0; line-height: 1.5; }
  .small { font-size: 12px; color: #999; margin-top: 16px; }
  button.big { margin-top: 18px; font-size: 22px; padding: 12px 36px; border: 0; border-radius: 14px; background: #f3c74f; color: #3a2400; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #8a5a00; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
  .card { width: 180px; padding: 14px; border-radius: 14px; background: #3a0f14; border: 3px solid #c99a2e; cursor: pointer; }
  .card:hover { background: #561820; border-color: #ffe08a; }
  .card .icon { font-size: 40px; }
  .card .name { font-weight: bold; font-size: 17px; margin: 6px 0; color: #f3c74f; }
  .card .desc { font-size: 14px; color: #ddd; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start" class="overlay">
  <h1>⚡ 해리 포터 생존기</h1>
  <p>인페리우스, 어둠의 마법사, 디멘터를 물리치고</p>
  <p><b>5분</b>이 되면 나타나는 <b>볼드모트</b>를 쓰러뜨려라!</p>
  <p>마법은 <b>자동</b>으로 나가요. 너는 움직이기만 하면 돼!</p>
  <p>⌨️ 방향키 / WASD &nbsp; 📱 화면을 누르고 끌기</p>
  <button class="big" id="startBtn">시작!</button>
  <p class="small">혼자 즐기는 팬 게임이에요 (해리 포터는 J.K. 롤링과 워너 브라더스의 작품)</p>
</div>

<div id="levelup" class="overlay hidden">
  <h1>⭐ 레벨 업!</h1>
  <p>배울 마법을 하나 골라!</p>
  <div class="cards" id="cards"></div>
</div>

<div id="end" class="overlay hidden">
  <h1 id="endTitle"></h1>
  <p id="endText"></p>
  <button class="big" id="againBtn">다시 하기</button>
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, vignette;
function resize() {
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.hypot(W, H) * 0.6);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,10,0.7)');
}
addEventListener('resize', resize); resize();

const TROLL_TIME = 150;   // 2분 30초
const FINAL_TIME = 300;   // 5분 - 볼드모트

// ---------- 마법 & 강화 목록 ----------
const UPGRADES = {
  bolt:      { icon: '✨', name: '스투페파이',     desc: '가장 가까운 적에게 기절 마법 발사', weapon: true },
  orbit:     { icon: '🔥', name: '인센디오',       desc: '내 주위를 빙빙 도는 불꽃', weapon: true },
  lightning: { icon: '⚡', name: '번개 마법',      desc: '하늘에서 적에게 번개가 쾅!', weapon: true },
  frost:     { icon: '❄️', name: '글래시우스',     desc: '가까운 적을 얼리고 느리게', weapon: true },
  potion:    { icon: '🧪', name: '폭발 물약',      desc: '물약을 던져 펑! 터뜨리기', weapon: true },
  patronus:  { icon: '🦌', name: '익스펙토 패트로눔', desc: '은빛 사슴이 돌진! 디멘터에게 3배', weapon: true },
  speed:     { icon: '🧹', name: '빗자루',         desc: '이동 속도 +12%' },
  heart:     { icon: '❤️', name: '튼튼한 몸',      desc: '최대 체력 +25, 체력 회복' },
  magnet:    { icon: '🧲', name: '아씨오',         desc: '보석을 더 멀리서 끌어옴' },
  power:     { icon: '💪', name: '마법 힘',        desc: '모든 마법 공격력 +15%' },
  haste:     { icon: '⏱️', name: '빠른 주문',      desc: '마법 쿨타임 -8%' },
};
const MAX_LV = 5;

// ---------- 적 종류 ----------
const ENEMY_TYPES = {
  inferius:  { hp: 16,   spd: 50, r: 13, dmg: 8,  xp: 1,  color: '#aab6b0' },
  wizard:    { hp: 30,   spd: 58, r: 14, dmg: 10, xp: 2,  color: '#222' },
  dementor:  { hp: 45,   spd: 85, r: 16, dmg: 14, xp: 3,  color: '#333' },
  troll:     { hp: 1200, spd: 42, r: 44, dmg: 25, xp: 60, color: '#7d7466', boss: true, name: '거대 트롤' },
  voldemort: { hp: 2200, spd: 75, r: 22, dmg: 30, xp: 0,  color: '#2f2', boss: true, name: '볼드모트' },
};

let S;
function newGame() {
  S = {
    t: 0, kills: 0, running: true, paused: false, trollDone: false, final: false, msg: null, hurtT: 0,
    p: { x: 0, y: 0, r: 14, hp: 100, maxHp: 100, inv: 0, lv: 1, xp: 0, next: 5, face: 1, moving: false },
    up: { bolt: 1, orbit: 0, lightning: 0, frost: 0, potion: 0, patronus: 0, speed: 0, heart: 0, magnet: 0, power: 0, haste: 0 },
    cd: { bolt: 0, lightning: 0, potion: 0, patronus: 1 },
    enemies: [], shots: [], eshots: [], gems: [], potions: [], fx: [], texts: [], bolts: [], stags: [],
    spawnT: 0, orbitA: 0,
  };
}

// ---------- 입력 ----------
const keys = {};
addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
let joy = null;
cv.addEventListener('pointerdown', e => { joy = { sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY }; });
addEventListener('pointermove', e => { if (joy) { joy.x = e.clientX; joy.y = e.clientY; } });
addEventListener('pointerup', () => joy = null);
addEventListener('pointercancel', () => joy = null);

// ---------- 도우미 ----------
const rand = (a, b) => a + Math.random() * (b - a);
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
const dmgMul = () => 1 + 0.15 * S.up.power;
const cdMul = () => 1 - 0.08 * S.up.haste;
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function glow(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; circ(x, y, r);
}

function hurtEnemy(e, dmg) {
  dmg = Math.round(dmg * dmgMul());
  e.hp -= dmg; e.flash = 0.1;
  S.texts.push({ x: e.x, y: e.y - e.r, s: String(dmg), life: 0.6 });
}
function hurtPlayer(d) {
  const p = S.p;
  if (p.inv > 0) return;
  p.hp -= d; p.inv = 0.5; S.hurtT = 0.25;
  S.texts.push({ x: p.x, y: p.y - 30, s: '-' + d, life: 0.6, red: true });
}
function nearestEnemy(maxD = 600, filter) {
  let best = null, bd = maxD * maxD;
  for (const e of S.enemies) {
    if (filter && !filter(e)) continue;
    const d = dist2(e, S.p); if (d < bd) { bd = d; best = e; }
  }
  return best;
}
function burst(x, y, color, n = 8) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(40, 160);
    S.fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5, color });
  }
}

// ---------- 적 생성 ----------
function spawnAt(type, x, y) {
  const T = ENEMY_TYPES[type];
  const hpMul = T.boss ? 1 + S.t / 120 : 1 + S.t / 60 * 0.5;
  const e = { type, x, y, hp: T.hp * hpMul, maxHp: T.hp * hpMul, r: T.r, spd: T.spd, dmg: T.dmg, xp: T.xp,
    color: T.color, boss: !!T.boss, name: T.name, flash: 0, orbitHit: 0, slow: 0,
    seed: Math.random() * 10, cd: rand(1, 3), cdA: 2, cdB: 4, cdC: 6 };
  S.enemies.push(e);
  return e;
}
function spawnEnemy(type) {
  const a = rand(0, Math.PI * 2), d = Math.hypot(W, H) / 2 + 60;
  return spawnAt(type, S.p.x + Math.cos(a) * d, S.p.y + Math.sin(a) * d);
}
function pickType() {
  const t = S.t, r = Math.random();
  if (t > 240) return r < 0.4 ? 'dementor' : r < 0.65 ? 'wizard' : 'inferius';
  if (t > 150) return r < 0.3 ? 'dementor' : r < 0.55 ? 'wizard' : 'inferius';
  if (t > 45) return r < 0.3 ? 'wizard' : 'inferius';
  return 'inferius';
}
function enemyShot(e, a, spd, dmg, color) {
  S.eshots.push({ x: e.x, y: e.y - 6, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: 4, dmg, color });
}

// ---------- 레벨업 ----------
function levelUp() {
  S.paused = true;
  const pool = Object.keys(UPGRADES).filter(k => S.up[k] < MAX_LV);
  pool.sort(() => Math.random() - 0.5);
  const box = document.getElementById('cards');
  box.innerHTML = '';
  const choices = pool.slice(0, 3);
  if (choices.length === 0) choices.push('heal');
  for (const k of choices) {
    const u = k === 'heal' ? { icon: '🍫', name: '초콜릿 개구리', desc: '체력 50 회복' } : UPGRADES[k];
    const lv = k === 'heal' ? '' : (S.up[k] === 0 ? ' (새로!)' : ` Lv.${S.up[k] + 1}`);
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `<div class="icon">${u.icon}</div><div class="name">${u.name}${lv}</div><div class="desc">${u.desc}</div>`;
    el.onclick = () => choose(k);
    box.appendChild(el);
  }
  document.getElementById('levelup').classList.remove('hidden');
}
function choose(k) {
  const p = S.p;
  if (k === 'heal') p.hp = Math.min(p.maxHp, p.hp + 50);
  else {
    S.up[k]++;
    if (k === 'heart') { p.maxHp += 25; p.hp = Math.min(p.maxHp, p.hp + 40); }
  }
  document.getElementById('levelup').classList.add('hidden');
  S.paused = false;
}

// ---------- 업데이트 ----------
function update(dt) {
  const p = S.p, U = S.up;
  S.t += dt;
  S.hurtT = Math.max(0, S.hurtT - dt);

  // 이동
  let mx = 0, my = 0;
  if (keys['arrowleft'] || keys['a']) mx -= 1;
  if (keys['arrowright'] || keys['d']) mx += 1;
  if (keys['arrowup'] || keys['w']) my -= 1;
  if (keys['arrowdown'] || keys['s']) my += 1;
  if (joy) {
    const dx = joy.x - joy.sx, dy = joy.y - joy.sy, l = Math.hypot(dx, dy);
    if (l > 8) { mx = dx / Math.max(l, 50); my = dy / Math.max(l, 50); }
  }
  const ml = Math.hypot(mx, my);
  if (ml > 1) { mx /= ml; my /= ml; }
  const speed = 170 * (1 + 0.12 * U.speed);
  p.x += mx * speed * dt; p.y += my * speed * dt;
  p.moving = ml > 0.1;
  if (mx) p.face = Math.sign(mx);
  p.inv = Math.max(0, p.inv - dt);

  // 적 등장
  S.spawnT -= dt;
  if (S.spawnT <= 0 && S.enemies.length < 260) {
    S.spawnT = Math.max(0.14, 0.9 - S.t / FINAL_TIME * 0.75);
    if (S.final) S.spawnT *= 1.8;
    const n = 1 + Math.floor(Math.min(S.t, FINAL_TIME) / 60);
    for (let i = 0; i < n; i++) spawnEnemy(pickType());
  }
  if (!S.trollDone && S.t >= TROLL_TIME) {
    S.trollDone = true; spawnEnemy('troll');
    S.msg = { s: '⚠️ 거대 트롤 등장! ⚠️', life: 3 };
  }
  if (!S.final && S.t >= FINAL_TIME) {
    S.final = true;
    const v = spawnEnemy('voldemort');
    S.msg = { s: '💀 볼드모트가 나타났다! 💀', life: 4 };
    burst(v.x, v.y, '#3f3', 30);
  }

  // 스투페파이 (마법 화살)
  S.cd.bolt -= dt;
  if (S.cd.bolt <= 0) {
    const tgt = nearestEnemy();
    if (tgt) {
      S.cd.bolt = (0.9 - 0.08 * U.bolt) * cdMul();
      const n = 1 + Math.floor(U.bolt / 2);
      const base = Math.atan2(tgt.y - p.y, tgt.x - p.x);
      p.face = Math.cos(base) >= 0 ? 1 : -1;
      for (let i = 0; i < n; i++) {
        const a = base + (i - (n - 1) / 2) * 0.18;
        S.shots.push({ x: p.x + p.face * 22, y: p.y - 8, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, life: 1.5,
          dmg: 10 + 4 * U.bolt, pierce: U.bolt >= 5 ? 2 : 0, hit: new Set() });
      }
    }
  }
  for (const s of S.shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    for (const e of S.enemies) {
      if (s.life <= 0 || s.hit.has(e)) continue;
      if (dist2(s, e) < (e.r + 5) ** 2) {
        hurtEnemy(e, s.dmg); s.hit.add(e);
        if (s.pierce-- <= 0) s.life = 0;
      }
    }
  }
  S.shots = S.shots.filter(s => s.life > 0);

  // 인센디오 (불꽃 구슬)
  S.orbitA += dt * 3;
  if (U.orbit) {
    const n = U.orbit, R = 75;
    for (let i = 0; i < n; i++) {
      const a = S.orbitA + i * Math.PI * 2 / n;
      const o = { x: p.x + Math.cos(a) * R, y: p.y + Math.sin(a) * R };
      for (const e of S.enemies) {
        if (e.orbitHit <= 0 && dist2(o, e) < (e.r + 12) ** 2) { hurtEnemy(e, 8 + 4 * U.orbit); e.orbitHit = 0.4; }
      }
    }
  }

  // 번개
  if (U.lightning) {
    S.cd.lightning -= dt;
    if (S.cd.lightning <= 0) {
      S.cd.lightning = (2.4 - 0.25 * U.lightning) * cdMul();
      const vis = S.enemies.filter(e => Math.abs(e.x - p.x) < W / 2 && Math.abs(e.y - p.y) < H / 2);
      vis.sort(() => Math.random() - 0.5);
      for (const e of vis.slice(0, U.lightning)) {
        hurtEnemy(e, 25 + 12 * U.lightning);
        S.bolts.push({ x: e.x, y: e.y, life: 0.25, pts: Array.from({ length: 6 }, () => rand(-14, 14)) });
      }
    }
  }

  // 글래시우스 (얼음 바람)
  const frostR = U.frost ? 60 + 15 * U.frost : 0;

  // 폭발 물약
  if (U.potion) {
    S.cd.potion -= dt;
    if (S.cd.potion <= 0) {
      S.cd.potion = 2.6 * cdMul();
      for (let i = 0; i < U.potion; i++) {
        const e = S.enemies[Math.floor(Math.random() * S.enemies.length)];
        const ok = e && dist2(e, p) < 350 ** 2;
        S.potions.push({ sx: p.x, sy: p.y, tx: ok ? e.x : p.x + rand(-200, 200), ty: ok ? e.y : p.y + rand(-200, 200), t: 0 });
      }
    }
  }
  for (const pt of S.potions) {
    pt.t += dt / 0.6;
    if (pt.t >= 1) {
      const R = 55 + 8 * U.potion;
      for (const e of S.enemies) if (dist2(e, { x: pt.tx, y: pt.ty }) < (R + e.r) ** 2) hurtEnemy(e, 20 + 8 * U.potion);
      S.fx.push({ ring: true, x: pt.tx, y: pt.ty, R, life: 0.3 });
      burst(pt.tx, pt.ty, '#7cff7c', 10);
    }
  }
  S.potions = S.potions.filter(pt => pt.t < 1);

  // 익스펙토 패트로눔 (은빛 사슴)
  if (U.patronus) {
    S.cd.patronus -= dt;
    if (S.cd.patronus <= 0) {
      S.cd.patronus = (6.5 - 0.6 * U.patronus) * cdMul();
      const tgt = nearestEnemy(700, e => e.type === 'dementor') || nearestEnemy(700);
      const a = tgt ? Math.atan2(tgt.y - p.y, tgt.x - p.x) : rand(0, Math.PI * 2);
      S.stags.push({ x: p.x, y: p.y, vx: Math.cos(a) * 360, vy: Math.sin(a) * 360, life: 1.6, hit: new Set(), dmg: 30 + 12 * U.patronus });
    }
  }
  for (const st of S.stags) {
    st.x += st.vx * dt; st.y += st.vy * dt; st.life -= dt;
    for (const e of S.enemies) {
      if (st.hit.has(e) || dist2(st, e) > (e.r + 26) ** 2) continue;
      st.hit.add(e); hurtEnemy(e, e.type === 'dementor' ? st.dmg * 3 : st.dmg);
    }
    if (Math.random() < 0.6) S.fx.push({ x: st.x + rand(-10, 10), y: st.y + rand(-10, 10), vx: 0, vy: -20, life: 0.5, color: '#cfefff' });
  }
  S.stags = S.stags.filter(s => s.life > 0);

  // 적 움직임 & 공격
  for (const e of S.enemies) {
    e.flash -= dt; e.orbitHit -= dt;
    let sp = e.spd;
    if (frostR && dist2(e, p) < (frostR + e.r) ** 2) { sp *= 0.55; e.hp -= (10 + 6 * U.frost) * dmgMul() * dt; e.slow = 0.1; }
    else e.slow -= dt;
    const dx = p.x - e.x, dy = p.y - e.y, l = Math.hypot(dx, dy) || 1;
    const toP = Math.atan2(dy, dx);
    let ux = dx / l, uy = dy / l;

    if (e.type === 'voldemort') {
      // 거리를 두고 싸우는 볼드모트
      if (l < 180) { ux = -ux; uy = -uy; }
      else if (l < 260) { const t = ux; ux = -uy; uy = t; }
      e.cdA -= dt; e.cdB -= dt; e.cdC -= dt;
      if (e.cdA <= 0) { e.cdA = 1.6; for (let i = -1; i <= 1; i++) enemyShot(e, toP + i * 0.2, 230, 14, 'green'); }
      if (e.cdB <= 0) { e.cdB = 4; for (let i = 0; i < 14; i++) enemyShot(e, i * Math.PI * 2 / 14 + S.t, 150, 12, 'green'); }
      if (e.cdC <= 0) {
        e.cdC = 9;
        for (let i = 0; i < 5; i++) { const a = rand(0, 6.28); spawnAt('inferius', e.x + Math.cos(a) * 60, e.y + Math.sin(a) * 60); }
        S.msg = { s: '인페리우스를 불러냈다!', life: 1.5 };
      }
    } else if (e.type === 'wizard') {
      e.cd -= dt;
      if (e.cd <= 0 && l < 380) { e.cd = rand(2.5, 4); enemyShot(e, toP, 200, 10, 'red'); }
      if (l < 150) { ux *= 0.2; uy *= 0.2; }
    }
    e.x += ux * sp * dt; e.y += uy * sp * dt;
    if (l < e.r + p.r) hurtPlayer(e.dmg);
  }
  // 적 마법 공격
  for (const s of S.eshots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (dist2(s, { x: p.x, y: p.y - 6 }) < (p.r + 6) ** 2) { hurtPlayer(s.dmg); s.life = 0; }
  }
  S.eshots = S.eshots.filter(s => s.life > 0);

  // 적끼리 겹치지 않게
  const E = S.enemies;
  for (let i = 0; i < E.length; i++) for (let j = i + 1; j < E.length; j++) {
    const a = E[i], b = E[j], dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
    if (Math.abs(dx) > rr || Math.abs(dy) > rr) continue;
    const d = Math.hypot(dx, dy) || 0.1;
    if (d < rr) {
      const push = (rr - d) / 2, ux = dx / d, uy = dy / d;
      const wa = a.boss ? 0.1 : 1, wb = b.boss ? 0.1 : 1;
      a.x -= ux * push * wa; a.y -= uy * push * wa; b.x += ux * push * wb; b.y += uy * push * wb;
    }
  }
  // 죽은 적
  let voldyDead = false;
  S.enemies = E.filter(e => {
    if (e.hp <= 0) {
      S.kills++; burst(e.x, e.y, e.color, e.boss ? 50 : 8);
      if (e.type === 'voldemort') voldyDead = true;
      else if (e.boss) for (let i = 0; i < 15; i++) S.gems.push({ x: e.x + rand(-40, 40), y: e.y + rand(-40, 40), v: 4 });
      else S.gems.push({ x: e.x, y: e.y, v: e.xp });
      if (Math.random() < 0.015) S.gems.push({ x: e.x + 10, y: e.y, heal: true });
      return false;
    }
    if (!e.boss && dist2(e, p) > (Math.hypot(W, H) * 1.2) ** 2) return false;
    return true;
  });

  // 보석 모으기
  const mag = 90 * (1 + 0.4 * U.magnet);
  for (const g of S.gems) {
    const d2 = dist2(g, p);
    if (d2 < mag * mag) {
      const l = Math.sqrt(d2) || 1;
      g.x += (p.x - g.x) / l * 380 * dt; g.y += (p.y - g.y) / l * 380 * dt;
    }
    if (d2 < (p.r + 8) ** 2) {
      g.got = true;
      if (g.heal) p.hp = Math.min(p.maxHp, p.hp + 25);
      else p.xp += g.v;
    }
  }
  S.gems = S.gems.filter(g => !g.got);
  if (S.gems.length > 400) S.gems.splice(0, S.gems.length - 400);

  // 효과
  for (const f of S.fx) { f.life -= dt; if (!f.ring) { f.x += f.vx * dt; f.y += f.vy * dt; } }
  S.fx = S.fx.filter(f => f.life > 0);
  if (S.fx.length > 600) S.fx.splice(0, S.fx.length - 600);
  for (const t of S.texts) { t.life -= dt; t.y -= 30 * dt; }
  S.texts = S.texts.filter(t => t.life > 0);
  for (const b of S.bolts) b.life -= dt;
  S.bolts = S.bolts.filter(b => b.life > 0);
  if (S.msg) { S.msg.life -= dt; if (S.msg.life <= 0) S.msg = null; }

  // 레벨업
  if (p.xp >= p.next) { p.xp -= p.next; p.lv++; p.next = Math.floor(5 + p.lv * 3.5); levelUp(); }

  // 끝
  if (p.hp <= 0) endGame(false);
  else if (voldyDead) endGame(true);
}

  ctx.quadraticCurveTo(-14, 8, -8, -10); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#2b2b33'; ctx.lineWidth = 0.8; line(-3, -6, -6, 26); line(4, -6, 7, 26);
  // 지팡이 손 (창백하고 긴 손가락)
  ctx.strokeStyle = '#141418'; ctx.lineWidth = 5; ctx.lineCap = 'round'; line(5, -5, 14, 0);
  ctx.fillStyle = '#e8e4da'; ell(15.5, 0, 2.6, 2);
  ctx.strokeStyle = '#e8e4da'; ctx.lineWidth = 0.8; line(17, -1, 20, -2); line(17, 1, 20, 1.5);
  ctx.strokeStyle = '#d9cfbd'; ctx.lineWidth = 1.8; line(16, -1, 28, -8);
  ctx.fillStyle = '#cfc3ad'; circ(18, -2.2, 1.4); circ(21, -4, 1.1);
  glow(28.5, -8.5, 9, 'rgba(80,255,80,0.95)');
  // 하얀 대머리
  const hg = ctx.createRadialGradient(-2, -24, 2, 0, -20, 12);
  hg.addColorStop(0, '#f4f2ec'); hg.addColorStop(1, '#bfbcb2');
  ctx.fillStyle = hg; ell(1, -21, 8, 10);
  ctx.strokeStyle = 'rgba(120,140,160,.5)'; ctx.lineWidth = 0.5; line(-3, -27, -1, -22); line(4, -28, 3, -23);
  // 뱀 같은 얼굴: 빨간 눈, 콧구멍 틈
  glow(-0.5, -22, 3, 'rgba(255,0,0,0.7)'); glow(5, -22, 3, 'rgba(255,0,0,0.7)');
  ctx.fillStyle = '#d40000'; ell(-0.5, -22, 1.5, 1); ell(5, -22, 1.4, 1);
  ctx.fillStyle = '#000'; ctx.fillRect(-0.7, -22.8, 0.5, 1.6); ctx.fillRect(4.8, -22.8, 0.5, 1.6);
  ctx.strokeStyle = '#6d6a62'; ctx.lineWidth = 0.7; line(2, -18.8, 2.6, -17.5); line(3.6, -18.8, 4.2, -17.5);
  ctx.strokeStyle = '#8a857a'; ctx.lineWidth = 0.8; line(0.5, -14.5, 5.5, -14.8);
  ctx.restore();
}

function drawEnemy(e, x, y) {
  if (e.type === 'inferius') drawInferius(e, x, y);
  else if (e.type === 'wizard') drawWizard(e, x, y);
  else if (e.type === 'dementor') drawDementor(e, x, y);
  else if (e.type === 'troll') drawTroll(e, x, y);
  else if (e.type === 'voldemort') drawVoldemort(e, x, y);
  if (e.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,0.25)'; circ(x, y - e.r * 0.3, e.r * 0.9); }
  if (e.slow > 0) { ctx.strokeStyle = 'rgba(160,220,255,.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, e.r + 3, 0, 7); ctx.stroke(); }
  if (e.type === 'troll') {
    ctx.fillStyle = '#300'; ctx.fillRect(x - 40, y - 72, 80, 7);
    ctx.fillStyle = '#f44'; ctx.fillRect(x - 40, y - 72, 80 * Math.max(0, e.hp / e.maxHp), 7);
  }
}

function drawStag(st, x, y) {
  const f = st.vx >= 0 ? 1 : -1, t = S.t * 18;
  ctx.save(); ctx.translate(x, y); ctx.scale(f * 1.3, 1.3);
  ctx.globalCompositeOperation = 'lighter';
  glow(0, -4, 30, 'rgba(150,200,255,0.5)');
  ctx.globalAlpha = Math.min(1, st.life * 2);
  ctx.fillStyle = 'rgba(220,240,255,0.9)'; ctx.strokeStyle = 'rgba(220,240,255,0.9)'; ctx.lineCap = 'round';
  ell(0, -4, 11, 6);
  ctx.lineWidth = 2.2;
  line(-7, 0, -9 + Math.sin(t) * 4, 11); line(-4, 0, -2 - Math.sin(t) * 4, 11);
  line(6, 0, 8 + Math.sin(t) * 4, 11); line(8, 0, 11 - Math.sin(t) * 4, 11);
  ctx.lineWidth = 4; line(8, -7, 13, -14);
  ell(15, -15, 4, 2.6);
  ctx.lineWidth = 1.2; // 뿔
  line(13, -17, 10, -26); line(11, -22, 7, -24); line(10.5, -24.5, 12, -29);
  line(15, -17, 17, -26); line(16.5, -22, 20, -24); line(17, -25, 16, -29);
  ctx.restore();
}

function draw() {
  const p = S.p, ox = W / 2 - p.x, oy = H / 2 - p.y;
  // 바닥
  ctx.save(); ctx.translate(Math.round(ox), Math.round(oy)); ctx.fillStyle = floorTile;
  ctx.fillRect(-ox, -oy, W, H); ctx.restore();

  // 글래시우스
  if (S.up.frost) {
    const R = 60 + 15 * S.up.frost;
    const g = ctx.createRadialGradient(W / 2, H / 2, R * 0.3, W / 2, H / 2, R);
    g.addColorStop(0, 'rgba(150,220,255,0.05)'); g.addColorStop(1, 'rgba(170,230,255,0.3)');
    ctx.fillStyle = g; circ(W / 2, H / 2, R);
    ctx.strokeStyle = 'rgba(200,240,255,0.6)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 6; i++) {
      const a = S.t * 1.5 + i * Math.PI / 3, cx = W / 2 + Math.cos(a) * R * 0.8, cy = H / 2 + Math.sin(a) * R * 0.8;
      for (let k = 0; k < 3; k++) { const b = k * Math.PI / 3; line(cx - Math.cos(b) * 4, cy - Math.sin(b) * 4, cx + Math.cos(b) * 4, cy + Math.sin(b) * 4); }
    }
  }
  // 보석
  for (const gm of S.gems) {
    const x = gm.x + ox, y = gm.y + oy;
    if (x < -10 || y < -10 || x > W + 10 || y > H + 10) continue;
    if (gm.heal) { ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🍫', x, y + 6); continue; }
    const c = gm.v >= 3 ? '#ff6bd6' : gm.v >= 2 ? '#5ecbff' : '#7dff8a';
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + 5, y); ctx.lineTo(x, y + 6); ctx.lineTo(x - 5, y); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + 2, y - 1); ctx.lineTo(x - 2, y - 1); ctx.fill();
  }
  // 캐릭터들 (아래쪽에 있는 것을 나중에 그림)
  const list = [];
  for (const e of S.enemies) {
    const x = e.x + ox, y = e.y + oy, m = e.r * 2 + 30;
    if (x < -m || y < -m || x > W + m || y > H + m) continue;
    list.push(e);
  }
  list.push(p);
  list.sort((a, b) => a.y - b.y);
  for (const e of list) {
    if (e === p) drawHarry(W / 2, H / 2);
    else drawEnemy(e, e.x + ox, e.y + oy);
  }

  ctx.globalCompositeOperation = 'lighter';
  // 인센디오
  if (S.up.orbit) for (let i = 0; i < S.up.orbit; i++) {
    const a = S.orbitA + i * Math.PI * 2 / S.up.orbit;
    const x = W / 2 + Math.cos(a) * 75, y = H / 2 + Math.sin(a) * 75;
    glow(x, y, 20, 'rgba(255,120,20,0.8)');
    ctx.fillStyle = '#ffd36b'; circ(x, y, 6);
    for (let k = 1; k <= 3; k++) {
      const b = a - k * 0.12;
      ctx.fillStyle = `rgba(255,${120 - k * 25},20,${0.5 - k * 0.12})`;
      circ(W / 2 + Math.cos(b) * 75, H / 2 + Math.sin(b) * 75, 8 - k * 1.5);
    }
  }
  // 스투페파이
  for (const s of S.shots) {
    const x = s.x + ox, y = s.y + oy;
    glow(x, y, 14, 'rgba(255,60,60,0.8)');
    ctx.strokeStyle = 'rgba(255,120,120,0.6)'; ctx.lineWidth = 4;
    line(x, y, x - s.vx * 0.05, y - s.vy * 0.05);
    ctx.fillStyle = '#fff'; circ(x, y, 3);
  }
  // 적의 마법
  for (const s of S.eshots) {
    const x = s.x + ox, y = s.y + oy;
    glow(x, y, 16, s.color === 'green' ? 'rgba(60,255,60,0.85)' : 'rgba(255,40,40,0.85)');
    ctx.fillStyle = '#fff'; circ(x, y, 3);
  }
  // 번개
  for (const b of S.bolts) {
    const x = b.x + ox, y = b.y + oy;
    glow(x, y, 30, 'rgba(255,255,150,0.6)');
    ctx.strokeStyle = '#fffbc0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y - 300);
    b.pts.forEach((d, i) => ctx.lineTo(x + d, y - 300 + (i + 1) * 50));
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  // 패트로누스 사슴
  for (const st of S.stags) drawStag(st, st.x + ox, st.y + oy);
  // 폭발 물약
  for (const pt of S.potions) {
    const x = pt.sx + (pt.tx - pt.sx) * pt.t + ox, y = pt.sy + (pt.ty - pt.sy) * pt.t + oy - Math.sin(pt.t * Math.PI) * 60;
    ctx.save(); ctx.translate(x, y); ctx.rotate(pt.t * 10);
    ctx.fillStyle = '#3fdc5a'; circ(0, 2, 6);
    ctx.fillStyle = 'rgba(255,255,255,.5)'; circ(-2, 0, 2);
    ctx.fillStyle = '#cfe'; ctx.fillRect(-2, -8, 4, 5);
    ctx.fillStyle = '#8a5a2b'; ctx.fillRect(-2.5, -10, 5, 2.5);
    ctx.restore();
  }
  // 효과
  for (const f of S.fx) {
    if (f.ring) {
      ctx.strokeStyle = `rgba(140,255,140,${f.life * 3})`; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(f.x + ox, f.y + oy, f.R * (1.3 - f.life), 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.globalAlpha = Math.min(1, f.life * 2); ctx.fillStyle = f.color; ctx.fillRect(f.x + ox - 2, f.y + oy - 2, 4, 4); ctx.globalAlpha = 1;
    }
  }
  ctx.textAlign = 'center'; ctx.font = 'bold 14px sans-serif';
  for (const t of S.texts) {
    ctx.fillStyle = '#000'; ctx.fillText(t.s, t.x + ox + 1, t.y + oy + 1);
    ctx.fillStyle = t.red ? '#ff5555' : '#fff'; ctx.fillText(t.s, t.x + ox, t.y + oy);
  }

  // 어두운 숲 테두리
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
  if (S.hurtT > 0) { ctx.fillStyle = `rgba(255,0,0,${S.hurtT})`; ctx.fillRect(0, 0, W, H); }

  // 조이스틱
  if (joy) {
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.sx, joy.sy, 50, 0, Math.PI * 2); ctx.stroke();
    const dx = joy.x - joy.sx, dy = joy.y - joy.sy, l = Math.min(50, Math.hypot(dx, dy)), a = Math.atan2(dy, dx);
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; circ(joy.sx + Math.cos(a) * l, joy.sy + Math.sin(a) * l, 20);
  }

  // 화면 정보
  ctx.fillStyle = '#222'; ctx.fillRect(0, 0, W, 10);
  ctx.fillStyle = '#5ecbff'; ctx.fillRect(0, 0, W * p.xp / p.next, 10);
  ctx.fillStyle = '#400'; ctx.fillRect(W / 2 - 24, H / 2 + 24, 48, 6);
  ctx.fillStyle = '#f44'; ctx.fillRect(W / 2 - 24, H / 2 + 24, 48 * Math.max(0, p.hp / p.maxHp), 6);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
  if (S.final) {
    const v = S.enemies.find(e => e.type === 'voldemort');
    ctx.fillStyle = '#7f7'; ctx.fillText('💀 볼드모트', W / 2, 44);
    if (v) {
      const bw = Math.min(400, W - 40);
      ctx.fillStyle = '#111'; ctx.fillRect(W / 2 - bw / 2, 54, bw, 12);
      ctx.fillStyle = '#2c2'; ctx.fillRect(W / 2 - bw / 2, 54, bw * Math.max(0, v.hp / v.maxHp), 12);
      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1; ctx.strokeRect(W / 2 - bw / 2, 54, bw, 12);
    }
  } else {
    const left = Math.max(0, FINAL_TIME - S.t);
    ctx.fillText(`${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}`, W / 2, 44);
  }
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`Lv.${p.lv}`, 12, 32);
  ctx.fillText(`❤️ ${Math.ceil(p.hp)}/${p.maxHp}`, 12, 54);
  ctx.textAlign = 'right'; ctx.fillText(`💀 ${S.kills}`, W - 12, 32);
  ctx.textAlign = 'left'; ctx.font = '16px sans-serif';
  let ix = 12;
  for (const k in S.up) if (S.up[k]) { ctx.fillText(`${UPGRADES[k].icon}${S.up[k]}`, ix, H - 14); ix += 44; }
  if (S.msg) {
    ctx.textAlign = 'center'; ctx.font = 'bold 28px sans-serif';
    ctx.fillStyle = '#000'; ctx.fillText(S.msg.s, W / 2 + 2, H / 3 + 2);
    ctx.fillStyle = '#ff5050'; ctx.fillText(S.msg.s, W / 2, H / 3);
  }
}

// ---------- 시작 / 끝 ----------
function endGame(win) {
  S.running = false;
  document.getElementById('endTitle').textContent = win ? '⚡ 볼드모트를 물리쳤다! ⚡' : '💥 쓰러졌다...';
  const m = Math.floor(S.t / 60), s = Math.floor(S.t % 60);
  document.getElementById('endText').innerHTML = `버틴 시간: ${m}분 ${s}초<br>물리친 적: ${S.kills}명<br>레벨: ${S.p.lv}`;
  document.getElementById('end').classList.remove('hidden');
}
function start() {
  newGame();
  document.getElementById('start').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
}
document.getElementById('startBtn').onclick = start;
document.getElementById('againBtn').onclick = start;

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S && S.running && !S.paused) update(dt);
  if (S) draw();
  else { ctx.fillStyle = '#0e0c18'; ctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
